name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Le workflow ne fait que lire le code.
permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente.
# Sur main, chaque exécution va au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Avant setup-node : le cache pnpm a besoin du binaire pnpm.
      # Sans « version », l'action lit le champ packageManager.
      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Formatage
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests et couverture
        run: pnpm test:coverage

      # Même si les tests échouent, pour pouvoir lire le rapport.
      - name: Publier le rapport de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      # Navigateurs de NF-CMP-01 et leurs dépendances système (--with-deps).
      # La version des navigateurs suit celle de @playwright/test.
      - name: Installer les navigateurs Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit

      - name: Tests de bout en bout
        run: pnpm test:e2e

      # Uniquement en cas d'échec : le rapport contient les traces à rejouer
      # dans le navigateur (voir apps/web/README.md).
      - name: Publier le rapport Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
